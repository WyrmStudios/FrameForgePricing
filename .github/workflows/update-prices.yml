name: Mirror relics.run Price Data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC
    - cron: '0 18 * * *'  # 18:00 UTC
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch price data
        id: fetch
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)

          # Fetches into price_history_latest.json, sets HTTP_CODE to the
          # response status (or "000" if curl couldn't connect at all).
          fetch_date() {
            HTTP_CODE=$(curl -s -o price_history_latest.json -w "%{http_code}" --max-time 30 \
              "https://relics.run/history/price_history_${1}.json")
            [ "$HTTP_CODE" = "200" ]
          }

          # Turns a raw HTTP code into a reason a human can act on.
          describe() {
            case "$1" in
              404) echo "not published yet (404)" ;;
              000) echo "no response / connection failed" ;;
              5??) echo "server error (HTTP $1)" ;;
              *)   echo "HTTP $1" ;;
            esac
          }

          fetch_date "$TODAY"; TODAY_CODE=$HTTP_CODE
          if [ "$TODAY_CODE" = "200" ]; then
            echo "Fetched today's data ($TODAY)"
          else
            fetch_date "$YESTERDAY"; YEST_CODE=$HTTP_CODE
            if [ "$YEST_CODE" = "200" ]; then
              echo "Fetched yesterday's data ($YESTERDAY) — today's ($TODAY) $(describe "$TODAY_CODE")"
            else
              echo "FETCH_FAILED=true" >> $GITHUB_ENV
              {
                echo "FETCH_ERROR<<EOF"
                echo "today ($TODAY): $(describe "$TODAY_CODE") · yesterday ($YESTERDAY): $(describe "$YEST_CODE")"
                echo "EOF"
              } >> $GITHUB_ENV
            fi
          fi

      - name: Retry on failure
        if: env.FETCH_FAILED == 'true'
        run: |
          sleep 30
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)

          fetch_date() {
            HTTP_CODE=$(curl -s -o price_history_latest.json -w "%{http_code}" --max-time 30 \
              "https://relics.run/history/price_history_${1}.json")
            [ "$HTTP_CODE" = "200" ]
          }

          describe() {
            case "$1" in
              404) echo "not published yet (404)" ;;
              000) echo "no response / connection failed" ;;
              5??) echo "server error (HTTP $1)" ;;
              *)   echo "HTTP $1" ;;
            esac
          }

          fetch_date "$TODAY"; TODAY_CODE=$HTTP_CODE
          if [ "$TODAY_CODE" = "200" ]; then
            echo "FETCH_FAILED=" >> $GITHUB_ENV
          else
            fetch_date "$YESTERDAY"; YEST_CODE=$HTTP_CODE
            if [ "$YEST_CODE" = "200" ]; then
              echo "FETCH_FAILED=" >> $GITHUB_ENV
            else
              {
                echo "FETCH_ERROR<<EOF"
                echo "today ($TODAY): $(describe "$TODAY_CODE") · yesterday ($YESTERDAY): $(describe "$YEST_CODE") (after retry)"
                echo "EOF"
              } >> $GITHUB_ENV
            fi
          fi

      - name: Notify Discord on double failure
        if: env.FETCH_FAILED == 'true'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **FrameForgePricing**: Failed to fetch price data from relics.run after 2 attempts ($(date -u +%Y-%m-%d)).\n${{ env.FETCH_ERROR }}\nUsers will see stale prices until this is resolved.\"}"

      - name: Fail job if both attempts failed
        if: env.FETCH_FAILED == 'true'
        run: exit 1

      - name: Fetch items.json
        run: |
          curl -f --max-time 30 -o items.json \
            "https://relics.run/history/item_data/items.json"

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history_latest.json items.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: mirror relics.run data $(date -u +%Y-%m-%d)"
            git push
          fi
