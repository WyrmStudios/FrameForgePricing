name: Mirror relics.run Price Data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC
    - cron: '0 18 * * *'  # 18:00 UTC
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch price data
        id: fetch
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)

          fetch_date() {
            curl -f --max-time 30 -o price_history_latest.json \
              "https://relics.run/history/price_history_${1}.json" 2>&1
          }

          # Try today, then yesterday (relics.run publishes the previous day's data)
          if fetch_date "$TODAY"; then
            echo "Fetched today's data ($TODAY)"
          elif fetch_date "$YESTERDAY"; then
            echo "Fetched yesterday's data ($YESTERDAY) — today's not published yet"
          else
            echo "FETCH_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Retry on failure
        if: env.FETCH_FAILED == 'true'
        run: |
          sleep 30
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)

          fetch_date() {
            curl -f --max-time 30 -o price_history_latest.json \
              "https://relics.run/history/price_history_${1}.json" 2>&1
          }

          if fetch_date "$TODAY" || fetch_date "$YESTERDAY"; then
            echo "FETCH_FAILED=" >> $GITHUB_ENV
          fi

      - name: Notify Discord on double failure
        if: env.FETCH_FAILED == 'true'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **FrameForgePricing**: Failed to fetch price data from relics.run after 2 attempts ($(date -u +%Y-%m-%d)). Users will see stale prices until this is resolved.\"}"

      - name: Fail job if both attempts failed
        if: env.FETCH_FAILED == 'true'
        run: exit 1

      - name: Fetch items.json (optional)
        run: |
          curl -f --max-time 30 -o items.json "https://relics.run/items.json" || \
            echo "items.json not available — skipping (FrameForge uses slug heuristic as fallback)"

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history_latest.json items.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: mirror relics.run data $(date -u +%Y-%m-%d)"
            git push
          fi
