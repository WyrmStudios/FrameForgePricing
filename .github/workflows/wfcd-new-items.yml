name: WFCD New Items

on:
  schedule:
    - cron: '30 7 * * *'  # 07:30 UTC daily
  workflow_dispatch:

concurrency:
  group: frameforgepricing-main-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download WFCD item files
        run: |
          # All.json no longer exists upstream; the app builds its catalogue from
          # these same category files (see wfcd.rs CATEGORIES).
          BASE="https://raw.githubusercontent.com/WFCD/warframe-items/master/data/json"
          mkdir -p wfcd_raw
          for c in Arcanes Arch-Gun Arch-Melee Archwing Fish Gear Glyphs Melee Misc Mods \
                   Pets Primary Railjack Relics Resources Secondary Sentinels \
                   SentinelWeapons Sigils Skins Warframes; do
            curl -sSfL --max-time 120 -o "wfcd_raw/$c.json" "$BASE/$c.json"
          done

      - name: Compare and announce new items
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WFCD_WEBHOOK_URL }}
        run: python scripts/wfcd_new_items.py wfcd_raw wfcd_items_snapshot.json

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wfcd_items_snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "chore: update WFCD item snapshot

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
            git pull --rebase
            git push
          fi
